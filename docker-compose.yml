version: '3.8'

services:
  app:
    build: .
    container_name: whatsapp-automation-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/ailocal
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - LOG_LEVEL=info
    volumes:
      - ./sessions:/usr/src/app/sessions
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: whatsapp-automation-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
